name: Compilar aplicativo Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          echo "SDK Manager encontrado: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Aceitar licencas Android
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          mkdir -p projeto

          ZIP=$(find . -type f \
            -iname "ControleMedicacoesAndroid_com_icone.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP com icone novo nao encontrado."
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d projeto

          echo "Procurando arquivos do projeto..."

          find projeto -maxdepth 7 -type f \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \) -print

          GRADLEW=$(find projeto -type f \
            -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew nao foi encontrado dentro do ZIP."
            echo "Arquivos encontrados:"
            find projeto -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJETO_DIR=$(dirname "$GRADLEW")

          if [ ! -f "$PROJETO_DIR/settings.gradle" ] && \
             [ ! -f "$PROJETO_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle nao encontrado junto de gradlew."
            exit 1
          fi

          echo "PROJETO_DIR=$PROJETO_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado em: $PROJETO_DIR"

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          echo "Pasta do projeto: $PROJETO_DIR"

          if [ ! -f "$PROJETO_DIR/gradlew" ]; then
            echo "ERRO: gradlew nao encontrado."
            exit 1
          fi

          if [ ! -d "$PROJETO_DIR/app" ]; then
            echo "ERRO: pasta app nao encontrada."
            find "$PROJETO_DIR" -maxdepth 4 -type d
            exit 1
          fi

          echo "Arquivos principais encontrados."

      - name: Ajustar compatibilidade Java e Kotlin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(os.environ["PROJETO_DIR"])

          files = (
              list(root.rglob("build.gradle")) +
              list(root.rglob("build.gradle.kts"))
          )

          for p in files:
              text = p.read_text(encoding="utf-8")

              text = re.sub(
                  r'jvmTarget\s*=\s*"[^"]+"',
                  'jvmTarget = "17"',
                  text
              )

              text = re.sub(
                  r'JavaVersion\.VERSION_1_[0-9]+',
                  'JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'JavaVersion\.VERSION_[0-9]+',
                  'JavaVersion.VERSION_17',
                  text
              )

              p.write_text(text, encoding="utf-8")
              print("Verificado:", p)
          PY

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJETO_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-android
          path: ${{ env.PROJETO_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
