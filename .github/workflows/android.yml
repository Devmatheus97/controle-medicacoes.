name: Compilar aplicativo Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licencas Android
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          true

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          mkdir -p projeto

          ZIP=$(find . -type f \
            -iname "ControleMedicacoesAndroid_com_icone.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP novo com icone nao encontrado."
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d projeto

          GRADLE_FILE=$(find projeto -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: settings.gradle nao encontrado."
            exit 1
          fi

          PROJETO_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJETO_DIR=$PROJETO_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado em: $PROJETO_DIR"

      - name: Ajustar compatibilidade Java e Kotlin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(os.environ["PROJETO_DIR"])

          files = (
              list(root.rglob("build.gradle")) +
              list(root.rglob("build.gradle.kts"))
          )

          for p in files:
              text = p.read_text(encoding="utf-8")

              text = re.sub(
                  r'jvmTarget\s*=\s*"[^"]+"',
                  'jvmTarget = "17"',
                  text
              )

              text = re.sub(
                  r'JavaVersion\.VERSION_1_[0-9]+',
                  'JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'JavaVersion\.VERSION_[0-9]+',
                  'JavaVersion.VERSION_17',
                  text
              )

              p.write_text(text, encoding="utf-8")
              print("Verificado:", p)
          PY

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJETO_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-android
          path: |
            ${{ env.PROJETO_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
