name: Compilar aplicativo Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME/platform-tools" ]; then
            echo "Instalando ferramentas Android..."
            mkdir -p "$ANDROID_HOME"
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado no ambiente."
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Aceitar licencas Android
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          mkdir -p projeto

          ZIP=$(find . -type f \
            -iname "ControleMedicacoesAndroid_com_icone.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP com icone novo nao encontrado."
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d projeto

          GRADLE_FILE=$(find projeto -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: settings.gradle nao encontrado."
            exit 1
          fi

          PROJETO_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJETO_DIR=$PROJETO_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado em: $PROJETO_DIR"

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          test -f "$PROJETO_DIR/gradlew" || {
            echo "ERRO: gradlew nao encontrado."
            exit 1
          }

          test -d "$PROJETO_DIR/app" || {
            echo "ERRO: pasta app nao encontrada."
            exit 1
          }

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJETO_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-android
          path: ${{ env.PROJETO_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
